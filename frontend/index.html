<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nakrani Imitation Admin</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #faf7f2; color: #2b2118; }
      .layout { display: flex; min-height: 100vh; }
      .sidebar { width: 240px; background: #3b2a1a; color: #f5e6c8; padding: 16px; }
      .sidebar h1 { font-size: 18px; color: #d4af37; }
      .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
      .sidebar a { color: #f5e6c8; text-decoration: none; padding: 6px 8px; border-radius: 6px; }
      .sidebar a.active { background: #d4af37; color: #3b2a1a; }
      .content { flex: 1; padding: 24px; overflow-x: auto; }
      .toolbar, .form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
      input { padding: 8px; border: 1px solid #d8cbb5; border-radius: 6px; }
      button { padding: 8px 14px; border: 0; border-radius: 6px; background: #d4af37; color: #2b2118; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; background: #fff; }
      th, td { padding: 8px; border-bottom: 1px solid #eee3d0; text-align: left; }
      .error { color: #b3261e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
